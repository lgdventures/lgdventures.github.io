<style>
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate{position:fixed;inset:0;z-index:-1;pointer-events:none}
.gate::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:56px 56px;background-position:center;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 25%,transparent 75%)}
.gate::after{content:"";position:absolute;left:50%;top:40%;width:min(900px,140vw);height:620px;transform:translate(-50%,-50%);background:radial-gradient(closest-side at 35% 45%,var(--glow-1),transparent 70%),radial-gradient(closest-side at 65% 40%,var(--glow-2),transparent 70%),radial-gradient(closest-side at 50% 70%,var(--glow-3),transparent 70%);filter:blur(20px)}
.box{width:100%;max-width:400px;padding:34px 30px 28px;border-radius:var(--radius-lg);text-align:center}
.box .mk{width:56px;height:56px;margin:0 auto;border-radius:15px;box-shadow:0 14px 30px -12px rgba(79,70,229,.7),0 0 0 1px var(--border)}
.box h1{margin:20px 0 0;font-size:24px;letter-spacing:-.03em;font-weight:700}
.box p.s{margin:6px 0 0;color:var(--muted);font-size:14.5px}
form{margin-top:24px;text-align:left}
.fld{position:relative;display:flex;align-items:center;height:50px;border-radius:13px;border:1px solid var(--border-strong);background:var(--bg);transition:border-color .15s,box-shadow .15s}
.fld:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));box-shadow:0 0 0 4px var(--accent-soft)}
.fld.err{border-color:var(--bad,#e11d48);box-shadow:0 0 0 4px rgba(225,29,72,.12);animation:shake .38s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.fld svg.l{width:18px;height:18px;margin:0 2px 0 14px;color:var(--muted);flex:none}
.fld input{appearance:none;-webkit-appearance:none;flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text);font:500 16px var(--font);padding:0 10px;letter-spacing:.01em}
.fld input::placeholder{color:var(--muted)}
.eye{appearance:none;border:0;background:transparent;color:var(--muted);width:44px;height:44px;margin-right:3px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.eye:hover{color:var(--text)}.eye svg{width:18px;height:18px}.eye .off{display:none}.eye[aria-pressed="true"] .on{display:none}.eye[aria-pressed="true"] .off{display:block}
.rem{appearance:none;display:flex;align-items:center;gap:10px;margin:16px 0 0;padding:4px 0;border:0;background:transparent;color:var(--text-2);font:500 14px var(--font);cursor:pointer;text-align:left}
.rem .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;transition:background-color .15s,border-color .15s;flex:none}
.rem .bx svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s var(--ease)}
.rem[aria-checked="true"] .bx{background:var(--accent);border-color:var(--accent)}
.rem[aria-checked="true"] .bx svg{opacity:1;transform:none}
:root[data-theme="dark"] .rem[aria-checked="true"] .bx svg{color:#0b0b14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rem[aria-checked="true"] .bx svg{color:#0b0b14}}
.go{margin-top:20px;width:100%;--h:50px}
.go .sp{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:none}
.go.busy .sp{display:block}.go.busy .t2{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{min-height:20px;margin:12px 0 0;font-size:13.5px;color:#e11d48;text-align:center}
:root[data-theme="dark"] .msg{color:#fb7185}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg{color:#fb7185}}
.fine{margin:18px 0 0;font-size:12.5px;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.fine svg{width:13px;height:13px}
noscript p{color:var(--text-2)}
</style>

        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
